<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px}.box{fill:white;stroke:#111;stroke-width:2}.thin{fill:white;stroke:#111;stroke-width:1.4}.ar{stroke:#111;stroke-width:1.8;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs><text x="600" y="38" text-anchor="middle" class="t">Simplified ECHO Source Queues and Route Control</text><rect x="30" y="70" width="190" height="90" rx="16" class="box"/><text x="125" y="108" text-anchor="middle" class="b">New task at</text><text x="125" y="132" text-anchor="middle" class="b">source EA n</text><rect x="265" y="70" width="245" height="90" rx="16" class="box"/><text x="388" y="100" text-anchor="middle" class="b">Estimate completion time</text><text x="388" y="124" text-anchor="middle" class="b">for local, neighbor, cloud</text><text x="388" y="148" text-anchor="middle" class="b">then compute ERT</text><rect x="555" y="70" width="230" height="90" rx="16" class="box"/><text x="670" y="104" text-anchor="middle" class="b">Keep routes with ERT ≥ 0</text><text x="670" y="132" text-anchor="middle" class="b">otherwise minimum lateness</text><rect x="830" y="70" width="335" height="90" rx="16" class="box"/><text x="998" y="104" text-anchor="middle" class="b">Unchanged HOODIE DQN selects</text><text x="998" y="132" text-anchor="middle" class="b">the final route</text><g class="ar"><path d="M220 115H265M510 115H555M785 115H830"/></g><text x="275" y="205" class="h">Source EA n: ECHO changes only waiting-task order</text><rect x="30" y="225" width="560" height="300" rx="18" class="box"/><text x="170" y="260" text-anchor="middle" class="h">Private queue</text><text x="445" y="260" text-anchor="middle" class="h">Offloading queue</text><g class="s"><rect x="70" y="285" width="85" height="58" rx="10" class="thin"/><text x="112" y="309" text-anchor="middle">T2</text><text x="112" y="330" text-anchor="middle">ERT=1</text><rect x="160" y="285" width="85" height="58" rx="10" class="thin"/><text x="202" y="309" text-anchor="middle">T4</text><text x="202" y="330" text-anchor="middle">ERT=3</text><rect x="250" y="285" width="85" height="58" rx="10" class="thin"/><text x="292" y="309" text-anchor="middle">T1</text><text x="292" y="330" text-anchor="middle">ERT=7</text><rect x="360" y="285" width="70" height="58" rx="10" class="thin"/><text x="395" y="309" text-anchor="middle">T5</text><text x="395" y="330" text-anchor="middle">ERT=0</text><rect x="435" y="285" width="70" height="58" rx="10" class="thin"/><text x="470" y="309" text-anchor="middle">T3</text><text x="470" y="330" text-anchor="middle">ERT=2</text><rect x="510" y="285" width="65" height="58" rx="10" class="thin"/><text x="542" y="309" text-anchor="middle">T6</text><text x="542" y="330" text-anchor="middle">ERT=5</text></g><text x="195" y="372" text-anchor="middle" class="s">Smallest non-negative ERT first</text><text x="465" y="372" text-anchor="middle" class="s">Smallest non-negative ERT first</text><rect x="100" y="400" width="190" height="78" rx="14" class="box"/><text x="195" y="431" text-anchor="middle" class="b">Local CPU</text><text x="195" y="455" text-anchor="middle" class="s">non-preemptive</text><rect x="370" y="400" width="170" height="78" rx="14" class="box"/><text x="455" y="431" text-anchor="middle" class="b">Transmitter</text><text x="455" y="455" text-anchor="middle" class="s">non-preemptive</text><g class="ar"><path d="M195 343V400M455 343V400"/></g><text x="820" y="205" class="h">Destinations: inherited HOODIE rules</text><rect x="620" y="225" width="545" height="300" rx="18" class="box"/><rect x="675" y="285" width="190" height="82" rx="14" class="box"/><text x="770" y="317" text-anchor="middle" class="b">Neighbor EA k</text><text x="770" y="342" text-anchor="middle" class="s">Public queue n — FIFO</text><rect x="935" y="285" width="170" height="82" rx="14" class="box"/><text x="1020" y="317" text-anchor="middle" class="b">Cloud</text><text x="1020" y="342" text-anchor="middle" class="s">Public queue n — FIFO</text><rect x="675" y="410" width="190" height="68" rx="14" class="box"/><text x="770" y="451" text-anchor="middle" class="b">Shared EA CPU</text><rect x="935" y="410" width="170" height="68" rx="14" class="box"/><text x="1020" y="451" text-anchor="middle" class="b">Shared cloud CPU</text><g class="ar"><path d="M770 367V410M1020 367V410M540 439L675 326M540 439L935 326"/></g><text x="602" y="360" class="s">horizontal</text><text x="727" y="392" class="s">vertical</text><rect x="30" y="565" width="560" height="100" rx="16" class="box"/><text x="310" y="595" text-anchor="middle" class="h">Outcome and reward</text><text x="310" y="624" text-anchor="middle" class="b">Success if completion ≤ deadline; otherwise drop at deadline.</text><text x="310" y="649" text-anchor="middle" class="b">Reward = HOODIE reward − λD × drop indicator.</text><rect x="620" y="565" width="545" height="100" rx="16" class="box"/><text x="892" y="595" text-anchor="middle" class="h">Unchanged boundaries</text><text x="892" y="624" text-anchor="middle" class="b">No interruption of active service; destination queues remain FIFO.</text><text x="892" y="649" text-anchor="middle" class="b">Equal destination-capacity sharing remains unchanged.</text></svg>