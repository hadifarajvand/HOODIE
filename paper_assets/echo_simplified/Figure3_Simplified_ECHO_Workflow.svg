<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:28px;font-weight:700}.b{font-size:17px}.s{font-size:15px}.box{fill:white;stroke:#111;stroke-width:2}.ar{stroke:#111;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs><text x="450" y="38" text-anchor="middle" class="t">Integrated Workflow of the Simplified ECHO Extension</text><ellipse cx="450" cy="90" rx="110" ry="34" class="box"/><text x="450" y="97" text-anchor="middle" class="b">Start / next slot</text><rect x="180" y="145" width="540" height="82" rx="18" class="box"/><text x="450" y="180" text-anchor="middle" class="b">Read inherited HOODIE state, queues, topology,</text><text x="450" y="205" text-anchor="middle" class="b">and LSTM load estimate</text><rect x="180" y="270" width="540" height="72" rx="18" class="box"/><text x="450" y="314" text-anchor="middle" class="b">Construct the task's absolute deadline</text><rect x="180" y="385" width="540" height="82" rx="18" class="box"/><text x="450" y="420" text-anchor="middle" class="b">Enumerate physically available local, connected-edge,</text><text x="450" y="445" text-anchor="middle" class="b">and cloud routes</text><rect x="180" y="510" width="540" height="72" rx="18" class="box"/><text x="450" y="554" text-anchor="middle" class="b">Estimate completion time and compute ERT for each route</text><polygon points="450,625 590,690 450,755 310,690" class="box"/><text x="450" y="682" text-anchor="middle" class="b">Any route with</text><text x="450" y="707" text-anchor="middle" class="b">ERT ≥ 0?</text><rect x="35" y="800" width="300" height="90" rx="18" class="box"/><text x="185" y="838" text-anchor="middle" class="b">Retain all routes</text><text x="185" y="865" text-anchor="middle" class="b">with non-negative ERT</text><rect x="565" y="800" width="300" height="90" rx="18" class="box"/><text x="715" y="838" text-anchor="middle" class="b">Retain only the</text><text x="715" y="865" text-anchor="middle" class="b">minimum-lateness route</text><rect x="165" y="940" width="570" height="72" rx="18" class="box"/><text x="450" y="983" text-anchor="middle" class="b">Unchanged HOODIE DQN selects from the resulting action set</text><rect x="140" y="1050" width="620" height="90" rx="18" class="box"/><text x="450" y="1085" text-anchor="middle" class="b">Admit task to the private/offloading queue; when a source resource is idle,</text><text x="450" y="1112" text-anchor="middle" class="b">serve the waiting task with the smallest non-negative ERT</text><g class="ar"><path d="M450 124V145M450 227V270M450 342V385M450 467V510M450 582V625M335 710L185 800M565 710L715 800M185 890L360 940M715 890L540 940M450 1012V1050"/></g><text x="262" y="748" class="s">Yes</text><text x="623" y="748" class="s">No</text><text x="450" y="1175" text-anchor="middle" class="s">Execution uses inherited HOODIE service rules. Success keeps the original delay reward; deadline drop adds the fixed λD penalty.</text></svg>